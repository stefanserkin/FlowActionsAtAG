minimum_cumulusci_version: '4.6.0'
project:
    name: FlowActionsAtAG
    package:
        name: Flow Actions at Asphalt Green
        namespace: asgr
        api_version: '63.0'
    git:
        default_branch: 'main'
    test:
        name_match: '%_Test%'
    source_format: sfdx

tasks:
    configure_scratch_user:
        description: Updates the default user to eastern time
        class_path: cumulusci.tasks.apex.anon.AnonymousApexTask
        options:
            apex: >
                User u = [SELECT Id, TimeZoneSidKey FROM User WHERE Alias = 'UUser' LIMIT 1];
                u.TimeZoneSidKey = 'America/New_York';
                update u;

    dx_deploy:
        description: Deploy metadata to the org using the new command
        class_path: cumulusci.tasks.sfdx.SFDXOrgTask
        options:
            command: "project deploy start --ignore-conflicts"
            
    dx_retrieve:
        description: Retrieve metadata from the org using the new command
        class_path: cumulusci.tasks.sfdx.SFDXOrgTask
        options:
            command: "project retrieve start --ignore-conflicts"

    robot:
        options:
            suites: robot/FlowActionsAtAG/tests
            options:
                outputdir: robot/FlowActionsAtAG/results

    robot_testdoc:
        options:
            path: robot/FlowActionsAtAG/tests
            output: robot/FlowActionsAtAG/doc/FlowActionsAtAG_tests.html

    run_tests:
        options:
            required_org_code_coverage_percent: 85

flows:
    config_dev:
        steps:
            10:
                task: configure_scratch_user

    config_managed:
        steps:
            10:
                task: configure_scratch_user

orgs:
    scratch:
        dev_named:
            config_file: orgs/dev.json
            days: 7
            namespaced: True
        build:
            config_file: orgs/build.json
            days: 1
            namespaced: True
